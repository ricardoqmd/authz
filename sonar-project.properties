# --- SonarQube Cloud project identity ---
sonar.organization=ricardoqmd
sonar.projectKey=ricardoqmd_authz

# --- Sources & tests ---
sonar.sources=packages/authz-core/src
sonar.tests=packages/authz-core/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# --- Coverage (LCOV produced by vitest, one report per package) ---
sonar.javascript.lcov.reportPaths=packages/authz-core/coverage/lcov.info

# --- Exclusions ---
sonar.exclusions=**/dist/**,**/node_modules/**,**/*.config.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.config.ts
